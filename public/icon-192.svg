<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="ic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="ic-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="ic-fire-dim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5050"/>
      <stop offset="100%" stop-color="#cc3a1a"/>
    </linearGradient>
    <linearGradient id="ic-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#c0c0c0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="ic-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF6B6B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#ic-bg)"/>
  <rect x="1" y="1" width="190" height="190" rx="41" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Ambient glow -->
  <ellipse cx="96" cy="96" rx="58" ry="38" fill="#FF6B6B" opacity="0.06"/>

  <!-- IRON above barbell -->
  <text x="96" y="50" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="32" letter-spacing="4" fill="#ffffff">IRON</text>

  <!-- Barbell — matches login screen BarbellMark layout, scaled 0.6 to 192px viewBox.
       Big plates sit on the INNER half of each sleeve, small plates sit OUTER.
       Bar sleeve tips remain visible past the smallest plate. -->
  <g filter="url(#ic-shadow)">
    <!-- Left sleeve (x 20-55) -->
    <rect x="20" y="92" width="35" height="9" rx="3" fill="url(#ic-steel)"/>
    <!-- Centre shaft (x 54-138) -->
    <rect x="54" y="94" width="84" height="5" rx="2" fill="url(#ic-steel)"/>
    <!-- Knurling overlay -->
    <rect x="60" y="95" width="72" height="3" rx="1" fill="rgba(0,0,0,0.22)"/>
    <!-- Right sleeve (x 137-172) -->
    <rect x="137" y="92" width="35" height="9" rx="3" fill="url(#ic-steel)"/>

    <!-- LEFT plates: big inner (against shaft) -->
    <rect x="41" y="73" width="13" height="47" rx="3" fill="url(#ic-fire)"/>
    <rect x="41" y="73" width="13" height="47" rx="3" fill="none" stroke="rgba(255,150,150,0.3)" stroke-width="1"/>
    <!-- LEFT plates: small outer (toward bar tip, sits on top) -->
    <rect x="34" y="80" width="8" height="32" rx="2" fill="url(#ic-fire-dim)"/>

    <!-- RIGHT plates: big inner -->
    <rect x="138" y="73" width="13" height="47" rx="3" fill="url(#ic-fire)"/>
    <rect x="138" y="73" width="13" height="47" rx="3" fill="none" stroke="rgba(255,150,150,0.3)" stroke-width="1"/>
    <!-- RIGHT plates: small outer -->
    <rect x="150" y="80" width="8" height="32" rx="2" fill="url(#ic-fire-dim)"/>
  </g>

  <!-- LOG below barbell -->
  <text x="96" y="158" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="28" letter-spacing="10" fill="url(#ic-fire)">LOG</text>
</svg>
