<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="ic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="ic-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="ic-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#c0c0c0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="ic-plo" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ff7a7a"/>
      <stop offset="55%" stop-color="#dd2b2b"/>
      <stop offset="100%" stop-color="#8a1010"/>
    </radialGradient>
    <radialGradient id="ic-pli" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ff6868"/>
      <stop offset="55%" stop-color="#cc2020"/>
      <stop offset="100%" stop-color="#7a0e0e"/>
    </radialGradient>
    <radialGradient id="ic-pro" cx="62%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ff7a7a"/>
      <stop offset="55%" stop-color="#dd2b2b"/>
      <stop offset="100%" stop-color="#8a1010"/>
    </radialGradient>
    <radialGradient id="ic-pri" cx="62%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ff6868"/>
      <stop offset="55%" stop-color="#cc2020"/>
      <stop offset="100%" stop-color="#7a0e0e"/>
    </radialGradient>
    <filter id="ic-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF6B6B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#ic-bg)"/>
  <rect x="1" y="1" width="190" height="190" rx="41" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Ambient glow -->
  <ellipse cx="96" cy="96" rx="60" ry="39" fill="#FF6B6B" opacity="0.06"/>

  <!-- IRON above barbell -->
  <text x="96" y="51" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="33" letter-spacing="3" fill="#ffffff">IRON</text>

  <g filter="url(#ic-shadow)">
    <!-- Chrome sleeves + shaft -->
    <rect x="12"  y="90" width="51" height="15" rx="6"   fill="url(#ic-steel)"/>
    <rect x="60"  y="93" width="72" height="9"  rx="4.5" fill="url(#ic-steel)"/>
    <rect x="129" y="90" width="51" height="15" rx="6"   fill="url(#ic-steel)"/>
    <!-- Knurling -->
    <rect x="69" y="94.5" width="54" height="6" rx="3" fill="rgba(0,0,0,0.22)"/>

    <!-- Left big inner plate (toward shaft, behind small plate) -->
    <rect x="36" y="66" width="27" height="60" rx="6"   fill="url(#ic-plo)" stroke="rgba(255,150,150,0.25)" stroke-width="1"/>
    <!-- Left small outer plate (collar/tip end, in front) -->
    <rect x="24" y="75" width="15" height="42" rx="4.5" fill="url(#ic-pli)"/>

    <!-- Right big inner plate (toward shaft, behind small plate) -->
    <rect x="129" y="66" width="27" height="60" rx="6"   fill="url(#ic-pro)" stroke="rgba(255,150,150,0.25)" stroke-width="1"/>
    <!-- Right small outer plate (collar/tip end, in front) -->
    <rect x="153" y="75" width="15" height="42" rx="4.5" fill="url(#ic-pri)"/>
  </g>

  <!-- LOG below barbell -->
  <text x="96" y="158" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="27" letter-spacing="9" fill="url(#ic-fire)">LOG</text>
</svg>
