<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141414"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>
    <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#999999;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF6B6B" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  
  <!-- Subtle border -->
  <rect x="1" y="1" width="190" height="190" rx="41" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Ambient glow behind dumbbell -->
  <ellipse cx="96" cy="88" rx="50" ry="30" fill="#FF6B6B" opacity="0.06"/>
  
  <!-- Dumbbell -->
  <g filter="shadow">
    <!-- Bar -->
    <rect x="46" y="83" width="100" height="10" rx="5" fill="url(#steel)" opacity="0.7"/>
    
    <!-- Left weight plates -->
    <rect x="28" y="68" width="14" height="40" rx="4" fill="url(#fire)"/>
    <rect x="38" y="73" width="10" height="30" rx="3" fill="url(#fire)" opacity="0.7"/>
    
    <!-- Right weight plates -->
    <rect x="150" y="68" width="14" height="40" rx="4" fill="url(#fire)"/>
    <rect x="144" y="73" width="10" height="30" rx="3" fill="url(#fire)" opacity="0.7"/>
    
    <!-- End caps -->
    <rect x="22" y="78" width="8" height="20" rx="3" fill="#fff" opacity="0.3"/>
    <rect x="162" y="78" width="8" height="20" rx="3" fill="#fff" opacity="0.3"/>
  </g>
  
  <!-- IRON text -->
  <text x="96" y="148" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="30" letter-spacing="6" fill="url(#steel)">IRON</text>
  
  <!-- LOG text with accent -->
  <text x="96" y="172" text-anchor="middle" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="18" letter-spacing="8" fill="url(#fire)">LOG</text>
  
  <!-- Diagonal scratch marks for grit -->
  <line x1="155" y1="20" x2="165" y2="35" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>
  <line x1="160" y1="18" x2="170" y2="33" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="150" y1="22" x2="158" y2="34" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
</svg>
