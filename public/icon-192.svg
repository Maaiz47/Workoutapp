<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="ic-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="ic-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="ic-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#c0c0c0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="ic-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF6B6B" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#ic-bg)"/>
  <rect x="1" y="1" width="190" height="190" rx="41" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Ambient glow -->
  <ellipse cx="96" cy="96" rx="58" ry="38" fill="#FF6B6B" opacity="0.06"/>

  <!-- IRON above barbell -->
  <text x="96" y="50" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="32" letter-spacing="4" fill="#ffffff">IRON</text>

  <!-- Barbell centred at y=96 -->
  <g filter="url(#ic-shadow)">
    <!-- Left sleeve -->
    <rect x="42" y="89" width="20" height="14" rx="4" fill="url(#ic-steel)"/>
    <!-- Centre shaft -->
    <rect x="60" y="92" width="72" height="8" rx="3" fill="url(#ic-steel)"/>
    <!-- Knurling overlay -->
    <rect x="72" y="93" width="48" height="6" rx="2" fill="rgba(0,0,0,0.2)"/>
    <!-- Right sleeve -->
    <rect x="130" y="89" width="20" height="14" rx="4" fill="url(#ic-steel)"/>

    <!-- Left outer plate -->
    <rect x="16" y="68" width="18" height="56" rx="5" fill="url(#ic-fire)"/>
    <rect x="16" y="68" width="18" height="56" rx="5" fill="none" stroke="rgba(255,150,150,0.25)" stroke-width="1"/>
    <!-- Left inner plate -->
    <rect x="31" y="80" width="12" height="32" rx="3" fill="url(#ic-fire)" opacity="0.7"/>

    <!-- Right outer plate -->
    <rect x="158" y="68" width="18" height="56" rx="5" fill="url(#ic-fire)"/>
    <rect x="158" y="68" width="18" height="56" rx="5" fill="none" stroke="rgba(255,150,150,0.25)" stroke-width="1"/>
    <!-- Right inner plate -->
    <rect x="149" y="80" width="12" height="32" rx="3" fill="url(#ic-fire)" opacity="0.7"/>
  </g>

  <!-- LOG below barbell -->
  <text x="96" y="158" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="28" letter-spacing="10" fill="url(#ic-fire)">LOG</text>
</svg>
