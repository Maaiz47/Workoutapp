<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111118"/>
      <stop offset="100%" style="stop-color:#0a0a10"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
    <linearGradient id="key" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#c8c4ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Shield -->
  <path d="M32 8 L52 16 L52 34 Q52 50 32 58 Q12 50 12 34 L12 16 Z"
        fill="url(#shield)" opacity="0.95"/>

  <!-- Shield inner dark -->
  <path d="M32 12 L48 19 L48 34 Q48 47 32 54 Q16 47 16 34 L16 19 Z"
        fill="#12102a"/>

  <!-- Key ring -->
  <circle cx="32" cy="29" r="8" fill="none" stroke="url(#key)" stroke-width="3.5"/>
  <!-- Key hole -->
  <circle cx="32" cy="29" r="2.5" fill="#12102a" stroke="rgba(162,155,254,0.5)" stroke-width="1"/>
  <!-- Key stem -->
  <line x1="32" y1="37" x2="32" y2="50" stroke="url(#key)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Key teeth -->
  <line x1="32" y1="42" x2="38" y2="42" stroke="url(#key)" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="48" x2="37" y2="48" stroke="url(#key)" stroke-width="3" stroke-linecap="round"/>
</svg>
