<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111118"/>
      <stop offset="100%" style="stop-color:#0a0a10"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe"/>
      <stop offset="100%" style="stop-color:#6c5ce7"/>
    </linearGradient>
    <linearGradient id="shieldInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1830"/>
      <stop offset="100%" style="stop-color:#120f28"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#a29bfe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#6c5ce7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <rect x="1" y="1" width="190" height="190" rx="41" fill="none" stroke="rgba(162,155,254,0.08)" stroke-width="1.5"/>

  <!-- Ambient purple glow -->
  <ellipse cx="96" cy="90" rx="56" ry="48" fill="#6c5ce7" opacity="0.07"/>

  <!-- Circuit traces — background layer -->
  <g stroke="rgba(162,155,254,0.15)" stroke-width="1" fill="none">
    <!-- horizontal traces -->
    <polyline points="18,54 40,54 48,62"/>
    <polyline points="174,54 152,54 144,62"/>
    <polyline points="18,136 38,136 46,128"/>
    <polyline points="174,136 154,136 146,128"/>
    <!-- corner dots -->
    <circle cx="18" cy="54" r="2.5" fill="rgba(162,155,254,0.25)" stroke="none"/>
    <circle cx="174" cy="54" r="2.5" fill="rgba(162,155,254,0.25)" stroke="none"/>
    <circle cx="18" cy="136" r="2.5" fill="rgba(162,155,254,0.25)" stroke="none"/>
    <circle cx="174" cy="136" r="2.5" fill="rgba(162,155,254,0.25)" stroke="none"/>
    <!-- short verticals -->
    <line x1="48" y1="38" x2="48" y2="62"/>
    <line x1="144" y1="38" x2="144" y2="62"/>
    <line x1="48" y1="154" x2="48" y2="128"/>
    <line x1="144" y1="154" x2="144" y2="128"/>
  </g>

  <!-- Shield shape (outer) -->
  <g filter="shadow">
    <path d="M96 26 L138 44 L138 88 Q138 122 96 148 Q54 122 54 88 L54 44 Z"
          fill="url(#shield)" opacity="0.95"/>
  </g>

  <!-- Shield inner fill -->
  <path d="M96 32 L132 48 L132 88 Q132 118 96 141 Q60 118 60 88 L60 48 Z"
        fill="url(#shieldInner)"/>

  <!-- Inner shield border glow -->
  <path d="M96 32 L132 48 L132 88 Q132 118 96 141 Q60 118 60 88 L60 48 Z"
        fill="none" stroke="rgba(162,155,254,0.3)" stroke-width="1"/>

  <!-- Key symbol -->
  <g filter="glow">
    <!-- Key head (ring) -->
    <circle cx="96" cy="78" r="16" fill="none" stroke="url(#keyGrad)" stroke-width="5"/>
    <!-- Key hole -->
    <circle cx="96" cy="78" r="5" fill="rgba(162,155,254,0.25)" stroke="rgba(162,155,254,0.5)" stroke-width="1.5"/>
    <!-- Key stem -->
    <line x1="96" y1="94" x2="96" y2="125" stroke="url(#keyGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- Key teeth -->
    <line x1="96" y1="108" x2="106" y2="108" stroke="url(#keyGrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="96" y1="119" x2="103" y2="119" stroke="url(#keyGrad)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Subtle sparkle dots -->
  <circle cx="70" cy="55" r="1.5" fill="rgba(162,155,254,0.4)"/>
  <circle cx="122" cy="55" r="1.5" fill="rgba(162,155,254,0.4)"/>
  <circle cx="65" cy="100" r="1" fill="rgba(162,155,254,0.3)"/>
  <circle cx="127" cy="100" r="1" fill="rgba(162,155,254,0.3)"/>

  <!-- ADMIN text -->
  <text x="96" y="168" text-anchor="middle"
        font-family="'Arial Black', 'Impact', sans-serif"
        font-weight="900" font-size="20" letter-spacing="5"
        fill="url(#shield)">ADMIN</text>
</svg>
