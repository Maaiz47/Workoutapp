<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="fv-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="fv-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="fv-plo" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ff7a7a"/>
      <stop offset="55%" stop-color="#dd2b2b"/>
      <stop offset="100%" stop-color="#8a1010"/>
    </radialGradient>
    <radialGradient id="fv-pli" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ff6868"/>
      <stop offset="55%" stop-color="#cc2020"/>
      <stop offset="100%" stop-color="#7a0e0e"/>
    </radialGradient>
    <radialGradient id="fv-pro" cx="62%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ff7a7a"/>
      <stop offset="55%" stop-color="#dd2b2b"/>
      <stop offset="100%" stop-color="#8a1010"/>
    </radialGradient>
    <radialGradient id="fv-pri" cx="62%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#ff6868"/>
      <stop offset="55%" stop-color="#cc2020"/>
      <stop offset="100%" stop-color="#7a0e0e"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#fv-bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

  <!-- Ambient glow -->
  <ellipse cx="32" cy="32" rx="20" ry="13" fill="#FF6B6B" opacity="0.06"/>

  <!-- IRON above barbell -->
  <text x="32" y="17" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="11" letter-spacing="1" fill="#ffffff">IRON</text>

  <!-- Chrome sleeves + shaft -->
  <rect x="4"  y="30" width="17" height="5" rx="2"   fill="url(#fv-steel)"/>
  <rect x="20" y="31" width="24" height="3" rx="1.5" fill="url(#fv-steel)"/>
  <rect x="43" y="30" width="17" height="5" rx="2"   fill="url(#fv-steel)"/>
  <!-- Knurling -->
  <rect x="23" y="31.5" width="18" height="2" rx="1" fill="rgba(0,0,0,0.25)"/>

  <!-- Left big inner plate (toward shaft, behind small plate) -->
  <rect x="12" y="22" width="9" height="20" rx="2"   fill="url(#fv-plo)" stroke="rgba(255,150,150,0.2)" stroke-width="0.5"/>
  <!-- Left small outer plate (collar/tip end, in front) -->
  <rect x="8"  y="25" width="5" height="14" rx="1.5" fill="url(#fv-pli)"/>

  <!-- Right big inner plate (toward shaft, behind small plate) -->
  <rect x="43" y="22" width="9" height="20" rx="2"   fill="url(#fv-pro)" stroke="rgba(255,150,150,0.2)" stroke-width="0.5"/>
  <!-- Right small outer plate (collar/tip end, in front) -->
  <rect x="51" y="25" width="5" height="14" rx="1.5" fill="url(#fv-pri)"/>

  <!-- LOG below barbell -->
  <text x="32" y="53" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="9" letter-spacing="3" fill="url(#fv-fire)">LOG</text>
</svg>
