<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="fv-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="fv-fire-dim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5050"/>
      <stop offset="100%" stop-color="#cc3a1a"/>
    </linearGradient>
    <linearGradient id="fv-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#fv-bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

  <!-- Ambient glow -->
  <ellipse cx="32" cy="32" rx="20" ry="13" fill="#FF6B6B" opacity="0.06"/>

  <!-- IRON above barbell -->
  <text x="32" y="17" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="11" letter-spacing="1" fill="#ffffff">IRON</text>

  <!-- Barbell — same layout as 192 icon, scaled to 64px.
       Big plates inner, small plates outer, bar tips visible past smallest plate. -->
  <!-- Left sleeve (x 7-18) -->
  <rect x="7" y="30.5" width="12" height="3" rx="1" fill="url(#fv-steel)"/>
  <!-- Centre shaft (x 18-46) -->
  <rect x="18" y="31.5" width="28" height="1.5" rx="0.7" fill="url(#fv-steel)"/>
  <!-- Knurling -->
  <rect x="20" y="31.7" width="24" height="1.1" rx="0.5" fill="rgba(0,0,0,0.22)"/>
  <!-- Right sleeve (x 45-57) -->
  <rect x="45" y="30.5" width="12" height="3" rx="1" fill="url(#fv-steel)"/>

  <!-- LEFT plates: big inner -->
  <rect x="14" y="24" width="5" height="16" rx="1" fill="url(#fv-fire)"/>
  <!-- LEFT plates: small outer -->
  <rect x="11" y="27" width="3" height="10" rx="0.7" fill="url(#fv-fire-dim)"/>

  <!-- RIGHT plates: big inner -->
  <rect x="45" y="24" width="5" height="16" rx="1" fill="url(#fv-fire)"/>
  <!-- RIGHT plates: small outer -->
  <rect x="50" y="27" width="3" height="10" rx="0.7" fill="url(#fv-fire-dim)"/>

  <!-- LOG below barbell -->
  <text x="32" y="53" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="9" letter-spacing="3" fill="url(#fv-fire)">LOG</text>
</svg>
