<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="fv-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <linearGradient id="fv-steel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#888888" stop-opacity="0.85"/>
    </linearGradient>
    <!-- Small outer plate: brighter red -->
    <radialGradient id="fv-sm-L" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ff8888"/>
      <stop offset="50%" stop-color="#ee3333"/>
      <stop offset="100%" stop-color="#8a0f0f"/>
    </radialGradient>
    <radialGradient id="fv-sm-R" cx="65%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ff8888"/>
      <stop offset="50%" stop-color="#ee3333"/>
      <stop offset="100%" stop-color="#8a0f0f"/>
    </radialGradient>
    <!-- Big inner plate: deeper red -->
    <radialGradient id="fv-lg-L" cx="35%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ff6060"/>
      <stop offset="50%" stop-color="#c41e1e"/>
      <stop offset="100%" stop-color="#6e0a0a"/>
    </radialGradient>
    <radialGradient id="fv-lg-R" cx="65%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ff6060"/>
      <stop offset="50%" stop-color="#c41e1e"/>
      <stop offset="100%" stop-color="#6e0a0a"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#fv-bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>

  <!-- Ambient glow -->
  <ellipse cx="32" cy="32" rx="20" ry="13" fill="#FF6B6B" opacity="0.07"/>

  <!-- IRON above barbell -->
  <text x="32" y="17" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="11" letter-spacing="1" fill="#ffffff">IRON</text>

  <!-- Chrome sleeves + shaft -->
  <!-- Left sleeve x=4–21, shaft x=21–43, right sleeve x=43–60 -->
  <rect x="4"  y="30" width="17" height="5" rx="2"   fill="url(#fv-steel)"/>
  <rect x="21" y="31" width="22" height="3" rx="1.5" fill="url(#fv-steel)"/>
  <rect x="43" y="30" width="17" height="5" rx="2"   fill="url(#fv-steel)"/>
  <rect x="24" y="31.5" width="16" height="2" rx="1" fill="rgba(0,0,0,0.25)"/>

  <!--
    LEFT:  chrome tip x=4–9 (5px), small outer x=9–13 (4px), big inner x=13–21 (8px)
    RIGHT: big inner x=43–51 (8px), small outer x=51–55 (4px), chrome tip x=55–60 (5px)
  -->

  <!-- Left big inner plate (toward shaft) -->
  <rect x="13" y="22" width="8" height="22" rx="2"   fill="url(#fv-lg-L)"/>
  <!-- Left small outer plate (collar/tip end) -->
  <rect x="9"  y="25" width="4" height="16" rx="1.5" fill="url(#fv-sm-L)"/>

  <!-- Right big inner plate (toward shaft) -->
  <rect x="43" y="22" width="8" height="22" rx="2"   fill="url(#fv-lg-R)"/>
  <!-- Right small outer plate (collar/tip end) -->
  <rect x="51" y="25" width="4" height="16" rx="1.5" fill="url(#fv-sm-R)"/>

  <!-- LOG below barbell -->
  <text x="32" y="53" text-anchor="middle"
        font-family="'Arial Black', Impact, sans-serif"
        font-weight="900" font-size="9" letter-spacing="3" fill="url(#fv-fire)">LOG</text>
</svg>
